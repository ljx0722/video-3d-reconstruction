version: "3.8"

services:
  gpu-worker:
    build:
      context: ./gpu_worker
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: video-3d
      MODEL_PATH: /models/checkpoint.pt
    volumes:
      - model_data:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  model_data:
