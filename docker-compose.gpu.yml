services:
  gpu-worker:
    build:
      context: .
      dockerfile: gpu_worker/Dockerfile
    environment:
      SEALOS_BACKEND_URL: ${SEALOS_BACKEND_URL:-http://backend:8000}
      GPU_SECRET: ${GPU_SECRET:?GPU_SECRET is required}
      MODEL_PATH: /models/checkpoint.pt
    volumes:
      - model_data:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  model_data:
