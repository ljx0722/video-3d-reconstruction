name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: video2gauss-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  REPO: ljx0722/video-3d-reconstruction

jobs:
  build-frontend:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.REPO }}-frontend:sha-${{ github.sha }}

  build-backend:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.REPO }}-backend:sha-${{ github.sha }}

  deploy:
    needs: [build-frontend, build-backend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: latest
      - name: Configure cluster
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.SEALOS_KUBECONFIG }}" | base64 -d > ~/.kube/config
      - name: Cleanup stale deployments
        run: |
          kubectl delete deployment postgres -n ns-mzyybqj8 --ignore-not-found=true || true
          kubectl delete deployment redis -n ns-mzyybqj8 --ignore-not-found=true || true
          kubectl delete deployment minio -n ns-mzyybqj8 --ignore-not-found=true || true
          kubectl delete deployment gpu-worker -n ns-mzyybqj8 --ignore-not-found=true || true
          kubectl delete pvc minio-data-pvc pgdata-pvc model-pvc -n ns-mzyybqj8 --ignore-not-found=true || true
      - name: Apply manifests
        run: |
          kubectl apply -f deploy/sealos/ingress.yaml
          kubectl apply -f deploy/sealos/backend.yaml
          kubectl apply -f deploy/sealos/frontend.yaml
      - name: Update images
        run: |
          kubectl set image deployment/frontend -n ns-mzyybqj8 \
            frontend=${{ env.REGISTRY }}/${{ env.REPO }}-frontend:sha-${{ github.sha }}
          kubectl set image deployment/backend -n ns-mzyybqj8 \
            backend=${{ env.REGISTRY }}/${{ env.REPO }}-backend:sha-${{ github.sha }}
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/frontend -n ns-mzyybqj8 --timeout=120s
          kubectl rollout status deployment/backend -n ns-mzyybqj8 --timeout=120s
      - name: Status check
        run: |
          echo "=== Pods ===" && kubectl get pods -n ns-mzyybqj8
          echo "=== Deployments ===" && kubectl get deployments -n ns-mzyybqj8
          echo "=== Ingress ===" && kubectl get ingress -n ns-mzyybqj8 -o wide
          echo "=== Check Sealos App CRDs ==="
          kubectl api-resources 2>/dev/null | grep -iE "sealos|app-deploy" || echo "no sealos CRDs found"
          echo "=== Gesture Island Ingress (recent console app) ==="
          kubectl get ingress network-pqkdiobdatlv -n ns-mzyybqj8 -o yaml 2>/dev/null || echo "not found"
          echo "=== All resources in namespace ==="
          kubectl get all -n ns-mzyybqj8 2>/dev/null | head -40 || true
          echo "=== Backend logs ===" && kubectl logs -n ns-mzyybqj8 deployment/backend --tail=30 || true
