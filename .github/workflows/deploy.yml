name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: video2gauss-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  REPO: ljx0722/video-3d-reconstruction

jobs:
  build-frontend:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.REPO }}-frontend:sha-${{ github.sha }}

  build-backend:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.REPO }}-backend:sha-${{ github.sha }}

  deploy:
    needs: [build-frontend, build-backend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: latest
      - name: Configure cluster
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.SEALOS_KUBECONFIG }}" | base64 -d > ~/.kube/config
      - name: Cleanup duplicates
        run: |
          kubectl delete deploy frontend -n ns-mzyybqj8 --ignore-not-found=true 2>/dev/null || true
          kubectl delete deploy backend -n ns-mzyybqj8 --ignore-not-found=true 2>/dev/null || true
          kubectl delete svc frontend -n ns-mzyybqj8 --ignore-not-found=true 2>/dev/null || true
          kubectl delete svc backend -n ns-mzyybqj8 --ignore-not-found=true 2>/dev/null || true
          for svc in $(kubectl get svc -n ns-mzyybqj8 -o name | grep video2gauss); do
            sname=$(echo $svc | cut -d/ -f2)
            if [ "$sname" != "video2gauss" ]; then
              echo "Deleting duplicate service: $sname"
              kubectl delete svc $sname -n ns-mzyybqj8 2>/dev/null || true
            fi
          done
      - name: Apply manifests
        run: |
          kubectl apply -f deploy/sealos/ingress.yaml
          kubectl apply -f deploy/sealos/combined.yaml
      - name: Update images
        run: |
          kubectl set image deployment/video2gauss -n ns-mzyybqj8 \
            frontend=${{ env.REGISTRY }}/${{ env.REPO }}-frontend:sha-${{ github.sha }} \
            backend=${{ env.REGISTRY }}/${{ env.REPO }}-backend:sha-${{ github.sha }}
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/video2gauss -n ns-mzyybqj8 --timeout=120s
      - name: Status
        run: |
          echo "=== GPU Nodes ===" && kubectl get nodes -o json 2>/dev/null | python3 -c "
import json,sys
for n in json.load(sys.stdin).get('items',[]):
    name=n['metadata']['name']
    caps=n.get('status',{}).get('capacity',{})
    print(f'{name}: gpu={caps.get(\"nvidia.com/gpu\",\"0\")} cpu={caps.get(\"cpu\",\"?\")} mem={caps.get(\"memory\",\"?\")}')
"
          echo "=== Pods ===" && kubectl get pods -n ns-mzyybqj8
          echo "=== Ingress ===" && kubectl get ingress -n ns-mzyybqj8
          echo "=== Backend ===" && kubectl logs -n ns-mzyybqj8 deployment/video2gauss -c backend --tail=10
