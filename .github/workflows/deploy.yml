name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: video2gauss-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  REPO: ljx0722/video-3d-reconstruction

jobs:
  test:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -p 'test*.py' -v
      - name: Install GPU mesh test dependencies
        run: pip install 'numpy>=1.26,<2' 'scipy>=1.11,<1.14' 'trimesh>=4.4,<5' 'matplotlib>=3.8,<4'
      - name: Run GPU worker tests
        run: python -m unittest gpu_worker.test_mesh_builder gpu_worker.test_artifact_v2 -v
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test and build frontend
        working-directory: frontend
        run: npm ci && npm test && npm run build

  build-frontend:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.REPO }}-frontend:sha-${{ github.sha }}

  build-backend:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.REPO }}-backend:sha-${{ github.sha }}

  deploy:
    needs: [build-frontend, build-backend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: latest
      - name: Configure cluster
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.SEALOS_KUBECONFIG }}" | base64 -d > ~/.kube/config
      - name: Cleanup duplicates
        run: |
          kubectl delete deploy frontend -n ns-mzyybqj8 --ignore-not-found=true 2>/dev/null || true
          kubectl delete deploy backend -n ns-mzyybqj8 --ignore-not-found=true 2>/dev/null || true
          kubectl delete svc frontend -n ns-mzyybqj8 --ignore-not-found=true 2>/dev/null || true
          kubectl delete svc backend -n ns-mzyybqj8 --ignore-not-found=true 2>/dev/null || true
          for svc in $(kubectl get svc -n ns-mzyybqj8 -o name | grep video2gauss); do
            sname=$(echo $svc | cut -d/ -f2)
            if [ "$sname" != "video2gauss" ]; then
              echo "Deleting duplicate service: $sname"
              kubectl delete svc $sname -n ns-mzyybqj8 2>/dev/null || true
            fi
          done
      - name: Apply production secrets
        env:
          GPU_SECRET: ${{ secrets.GPU_SECRET }}
        run: |
          test -n "$GPU_SECRET" || { echo "GPU_SECRET repository secret is required"; exit 1; }
          kubectl create secret generic video2gauss-secrets -n ns-mzyybqj8 \
            --from-literal=gpu-secret="$GPU_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Apply manifests
        run: |
          kubectl apply -f deploy/sealos/ingress.yaml
          kubectl apply -f deploy/sealos/combined.yaml
      - name: Update images
        run: |
          kubectl set image deployment/video2gauss -n ns-mzyybqj8 \
            frontend=${{ env.REGISTRY }}/${{ env.REPO }}-frontend:sha-${{ github.sha }} \
            backend=${{ env.REGISTRY }}/${{ env.REPO }}-backend:sha-${{ github.sha }}
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/video2gauss -n ns-mzyybqj8 --timeout=120s
      - name: Status
        run: |
          kubectl get nodes -n ns-mzyybqj8 2>/dev/null || echo "no-node-access"
          kubectl describe nodes 2>/dev/null | grep -A2 "nvidia" || echo "no-gpu-nodes"
          kubectl get pods -n ns-mzyybqj8
          kubectl get ingress -n ns-mzyybqj8
          kubectl logs -n ns-mzyybqj8 deployment/video2gauss -c backend --tail=10 || true
