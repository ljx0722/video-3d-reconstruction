apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ns-mzyybqj8
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "v2g"
            - name: POSTGRES_PASSWORD
              value: "v2gpass"
            - name: POSTGRES_DB
              value: "video2gauss"
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: pgdata-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ns-mzyybqj8
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
