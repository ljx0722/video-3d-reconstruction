apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: video3d-data-pvc
  namespace: ns-mzyybqj8
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: video2gauss
  namespace: ns-mzyybqj8
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2048m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /files
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
