apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ns-mzyybqj8
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/ljx0722/video-3d-reconstruction-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://v2g:v2gpass@postgres:5432/video2gauss"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: MINIO_ENDPOINT
              value: "minio:9000"
            - name: MINIO_ACCESS_KEY
              value: "minioadmin"
            - name: MINIO_SECRET_KEY
              value: "minioadmin"
            - name: MINIO_BUCKET
              value: "video-3d"
            - name: JWT_SECRET
              value: "video3d-jwt-secret-production-change-me"
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ns-mzyybqj8
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
