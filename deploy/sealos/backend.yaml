apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ns-mzyybqj8
  labels:
    cloud.sealos.io/app-deploy-manager: video-3d-reconstruction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        cloud.sealos.io/app-deploy-manager: video-3d-reconstruction
    spec:
      containers:
        - name: backend
          image: ghcr.io/ljx0722/video-3d-reconstruction-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "sqlite+aiosqlite:///./data/jobs.db"
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: video3d-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ns-mzyybqj8
  labels:
    cloud.sealos.io/app-deploy-manager: video-3d-reconstruction
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
